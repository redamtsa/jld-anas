<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جلد أنس</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>

  <style>
    :root {
      --bg-dark: #090a0f;
      --accent-gold: #f59e0b;
    }
    body {
      margin: 0;
      background-color: var(--bg-dark);
      font-family: 'Cairo', sans-serif;
      color: #f3f4f6;
      overflow-x: hidden;
      user-select: none;
    }
    .stage-container {
      position: relative;
      width: 100%;
      height: clamp(420px, 72vh, 760px);
      background: radial-gradient(circle at 50% 40%, #1e293b 0%, #0f172a 70%, #04060a 100%);
      border: 2px solid #334155;
      border-radius: 24px;
      overflow: hidden;
      cursor: crosshair;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 0 100px rgba(0,0,0,0.7);
    }
    .target-bg-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
    }
    .target-bg {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: saturate(1.1) contrast(1.05);
      transition: transform 0.05s ease-out;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      touch-action: none;
    }
    .shake {
      animation: shakeAnim 0.12s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shakeAnim {
      0% { transform: translate(0, 0) scale(1); }
      20% { transform: translate(-8px, 6px) scale(0.99); }
      40% { transform: translate(8px, -6px) scale(1.01); }
      60% { transform: translate(-5px, -4px) scale(1); }
      80% { transform: translate(5px, 4px) scale(1); }
      100% { transform: translate(0, 0) scale(1); }
    }

    .hit-phrase {
      position: absolute;
      transform: translate(-50%, -100%);
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #f59e0b;
      color: #ffffff;
      font-weight: 900;
      font-size: 1.15rem;
      padding: 6px 18px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4), 0 0 20px rgba(0,0,0,0.9);
      pointer-events: none;
      z-index: 30;
      white-space: nowrap;
      animation: floatUp 1.1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translate(-50%, -10px) scale(0.5) rotate(-6deg);
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -40px) scale(1.1) rotate(2deg);
      }
      70% {
        opacity: 1;
        transform: translate(-50%, -70px) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -100px) scale(0.85);
      }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

  <div class="max-w-5xl mx-auto w-full space-y-4">
    
    <!-- Header -->
    <header class="flex items-center justify-between border-b border-gray-800 pb-3 flex-wrap gap-3">
      <div class="flex items-center gap-3">
        <span class="p-2 bg-amber-500/10 border border-amber-500/30 rounded-xl text-amber-500">
          <i data-lucide="zap" class="w-6 h-6"></i>
        </span>
        <div>
          <h1 class="text-xl md:text-2xl font-black text-white">جلد انس </h1>
          <p class="text-xs text-gray-400">ضرب انس والاتحاد والنصر</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex flex-wrap items-center gap-3">
        
        <!-- Automatic Repository Image Dropdown -->
        <div class="flex items-center gap-2 bg-gray-800/90 border border-gray-700 rounded-xl px-3 py-1.5 text-xs text-gray-200">
          <i data-lucide="image" class="w-4 h-4 text-amber-400"></i>
          <label for="imageSelect" class="whitespace-nowrap font-bold">صورة الهدف:</label>
          <select id="imageSelect" class="bg-gray-900 text-amber-300 border border-gray-700 rounded-lg px-2 py-1 outline-none cursor-pointer text-xs font-bold focus:border-amber-500 max-w-[170px] truncate">
            <option value="5e079774-275b-4d4c-9b29-997ca60cc2a2.jfif">جاري تحميل الصور...</option>
          </select>
        </div>

        <!-- Sound Dropdown -->
        <div class="flex items-center gap-2 bg-gray-800/90 border border-gray-700 rounded-xl px-3 py-1.5 text-xs text-gray-200">
          <i data-lucide="volume-2" class="w-4 h-4 text-amber-400"></i>
          <label for="soundSelect" class="whitespace-nowrap font-bold">الصوت:</label>
          <select id="soundSelect" class="bg-gray-900 text-amber-300 border border-gray-700 rounded-lg px-2 py-1 outline-none cursor-pointer text-xs font-bold focus:border-amber-500">
            <option value="random">عشوائي (من الاصوات المرفوعة)</option>
            <option value="A.mp3">الصوت A (A.mp3)</option>
            <option value="B.mp3">الصوت B (B.mp3)</option>
            <option value="C.mp3">الصوت C (C.mp3)</option>
            <option value="D.mp3">الصوت D (D.mp3)</option>
            <option value="E.mp3">الصوت E (E.mp3)</option>
          </select>
        </div>

        <!-- Clear Marks Button -->
        <button id="clearMarksBtn" class="px-3.5 py-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-xs text-gray-300 rounded-xl flex items-center gap-2 transition cursor-pointer">
          <i data-lucide="eraser" class="w-4 h-4 text-amber-400"></i>
          <span>مسح الآثار</span>
        </button>
      </div>
    </header>

    <!-- Stage Area -->
    <main class="relative">
      <div id="stage" class="stage-container">
        
        <!-- Target Image Container -->
        <div id="targetWrapper" class="target-bg-container">
          <img id="targetImg" class="target-bg" src="5e079774-275b-4d4c-9b29-997ca60cc2a2.jfif" alt="Target Person" />
        </div>
        
        <!-- Canvas for Whip Animation -->
        <canvas id="whipCanvas"></canvas>

        <!-- Click Hint -->
        <div id="hintOverlay" class="absolute bottom-5 left-1/2 transform -translate-x-1/2 bg-black/80 backdrop-blur-md px-5 py-2 rounded-full border border-gray-700 text-xs text-amber-300 pointer-events-none flex items-center gap-2 z-20 shadow-lg transition-opacity duration-300">
          <i data-lucide="mouse-pointer-click" class="w-4 h-4 animate-bounce"></i>
          <span>اضغط على الشاشة لإطلاق ضربة السوط</span>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="flex items-center justify-between text-xs text-gray-500 pt-1 border-t border-gray-800/60">
    </footer>
  </div>

  <script>
    lucide.createIcons();

    // =========================================================================
    // 📝 قائمة العبارات الـ 6 التي تظهر عند ضرب السوط (يمكنك تعديل النص بين التنصيص):
    // =========================================================================
    const HIT_PHRASES = [
      "اجلدني أكثر", // العبارة 1
      "الله لايوفق الاتحاد",             // العبارة 2
      "الله لايوفق النصر",             // العبارة 3
      "اضربني ضرب",             // العبارة 4
      "ادعسني",             // العبارة 5
      "اجلدني جلد"              // العبارة 6
    ];

    const stage = document.getElementById('stage');
    const canvas = document.getElementById('whipCanvas');
    const ctx = canvas.getContext('2d');
    const targetWrapper = document.getElementById('targetWrapper');
    const targetImg = document.getElementById('targetImg');
    const clearMarksBtn = document.getElementById('clearMarksBtn');
    const hintOverlay = document.getElementById('hintOverlay');
    const soundSelect = document.getElementById('soundSelect');
    const imageSelect = document.getElementById('imageSelect');

    let width = 0, height = 0;
    let impactMarks = [];
    let shockwaves = [];
    let particles = [];

    // Local MP3 audio files in repository
    const MP3_SOUNDS = ['A.mp3', 'B.mp3', 'C.mp3', 'D.mp3', 'E.mp3'];

    // =========================================================================
    // 🔍 الاستكشاف التلقائي لجميع الصور المرفوعة في المستودع عبر GitHub API:
    // =========================================================================
    async function loadGitHubRepoImages() {
      let owner = 'redamtsa';
      let repo = 'jld-anas';

      // إذا تم تشغيل الموقع على GitHub Pages تلقائياً يستنتج اسم المستخدم والمستودع
      if (window.location.hostname.endsWith('.github.io')) {
        owner = window.location.hostname.split('.')[0];
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        if (pathParts.length > 0) {
          repo = pathParts[0];
        }
      }

      try {
        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`);
        if (!response.ok) throw new Error('Could not fetch repository contents');

        const files = await response.json();
        
        // تصفية الملفات للحصول على جميع الصور المرفوعة بالمستودع بأي صيغة
        const imageExtensions = /\.(jpg|jpeg|jfif|png|webp|gif|svg)$/i;
        const imageFiles = files.filter(f => f.type === 'file' && imageExtensions.test(f.name));

        if (imageFiles.length > 0) {
          imageSelect.innerHTML = '';
          imageFiles.forEach(file => {
            const opt = document.createElement('option');
            opt.value = file.name;
            opt.textContent = file.name;
            imageSelect.appendChild(opt);
          });

          // تعيين أول صورة أو الصورة الافتراضية
          targetImg.src = imageSelect.value;
        }
      } catch (err) {
        console.warn("جاري استخدام القائمة الاحتياطية للصور المحمّلة محلياً:", err);
        // قائمة احتياطية في حال الفتح المحلي بدون إنترنت
        const fallbackImages = [
          "5e079774-275b-4d4c-9b29-997ca60cc2a2.jfif",
          "انس.jfif",
          "انس ٢.jpg",
          "انس ٣.jpg",
          "الصلعون.jpg",
          "الاتحاد.jpg",
          "النصر.png"
        ];
        imageSelect.innerHTML = '';
        fallbackImages.forEach(imgName => {
          const opt = document.createElement('option');
          opt.value = imgName;
          opt.textContent = imgName;
          imageSelect.appendChild(opt);
        });
      }
    }

    imageSelect.addEventListener('change', (e) => {
      targetImg.src = e.target.value;
    });

    const P = {
      segments: 28,             // Chain length matching overlay physics
      segmentLength: 24,        // Link length in px
      taper: 0.6,               // Taper ratio towards tip
      gravity: 1.1,             // Gravity pulling whip
      damping: 0.95,            // Velocity retention per frame
      constraintIters: 20,      // Solver iterations

      handleMaxBendDeg: 16,     // Max bend angle near handle
      tipMaxBendDeg: 130,       // Max bend angle near tip
      bendRigidityStart: 0.8,   // Bend correction near handle
      bendRigidityEnd: 0.12,    // Bend correction near tip

      lineWidthHandle: 7,       // Base thickness near handle
      lineWidthTip: 5,          // Base thickness near tip
      outlineWidth: 3,          // Crisp white halo stroke width
      handleExtraWidth: 5,      // Handle extra base thickness
      handleThickSegments: 2,   // First 2 links get extra handle thickness
    };

    let whip = [];
    let handlePos = { x: 80, y: 0 };
    let isStriking = false;
    let strikeStartTime = 0;
    let strikeTarget = { x: 0, y: 0 };
    let strikeDuration = 380; // ms per full strike

    const segLen = (i) => P.segmentLength * (1 - (i / (P.segments - 1)) * (1 - P.taper));
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const lerp = (a, b, t) => a + (b - a) * t;

    function catmullPoint(pts, i) {
      const n = pts.length;
      if (n === 0) return { x: 0, y: 0 };
      if (i < 0) return n >= 2 ? { x: 2 * pts[0].x - pts[1].x, y: 2 * pts[0].y - pts[1].y } : { x: pts[0].x, y: pts[0].y };
      if (i >= n) return n >= 2 ? { x: 2 * pts[n - 1].x - pts[n - 2].x, y: 2 * pts[n - 1].y - pts[n - 2].y } : { x: pts[n - 1].x, y: pts[n - 1].y };
      return pts[i];
    }

    function whipSegmentBezier(pts, i) {
      const p0 = catmullPoint(pts, i - 1);
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = catmullPoint(pts, i + 2);
      return {
        cp1x: p1.x + (p2.x - p0.x) / 6,
        cp1y: p1.y + (p2.y - p0.y) / 6,
        cp2x: p2.x - (p3.x - p1.x) / 6,
        cp2y: p2.y - (p3.y - p1.y) / 6,
        x2: p2.x,
        y2: p2.y
      };
    }

    function initWhip() {
      const rect = stage.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      handlePos.x = width * 0.08;
      handlePos.y = height * 0.52;

      whip = [];
      let currentX = handlePos.x;
      let currentY = handlePos.y;

      for (let i = 0; i < P.segments; i++) {
        const t = i / (P.segments - 1);
        const l = segLen(i);
        currentX += l * 0.96;
        currentY += Math.sin(t * Math.PI) * 1.8;

        whip.push({
          x: currentX,
          y: currentY,
          px: currentX,
          py: currentY
        });
      }
    }

    function playWhipSound() {
      try {
        let soundFile = soundSelect ? soundSelect.value : 'random';
        if (soundFile === 'random') {
          const randomIndex = Math.floor(Math.random() * MP3_SOUNDS.length);
          soundFile = MP3_SOUNDS[randomIndex];
        }

        const audio = new Audio(soundFile);
        audio.currentTime = 0;
        audio.volume = 1.0;
        audio.play().catch(err => {
          console.warn("Audio play prevented:", err);
        });
      } catch (e) {
        console.warn("Error playing audio file:", e);
      }
    }

    function triggerStrike(targetX, targetY) {
      if (isStriking) return;

      isStriking = true;
      strikeStartTime = performance.now();
      strikeTarget = { x: targetX, y: targetY };

      setTimeout(() => {
        playWhipSound();
        createImpactEffects(targetX, targetY);
      }, strikeDuration * 0.55);
    }

    function showFloatingPhrase(x, y) {
      const validPhrases = HIT_PHRASES.filter(phrase => phrase && phrase.trim() !== "");
      if (validPhrases.length === 0) return;

      const chosenPhrase = validPhrases[Math.floor(Math.random() * validPhrases.length)];

      const bubble = document.createElement('div');
      bubble.className = 'hit-phrase';
      bubble.textContent = chosenPhrase;

      const clampedX = Math.max(90, Math.min(width - 90, x));
      const clampedY = Math.max(60, Math.min(height - 40, y));

      bubble.style.left = `${clampedX}px`;
      bubble.style.top = `${clampedY}px`;

      stage.appendChild(bubble);

      setTimeout(() => {
        if (bubble.parentNode) {
          bubble.parentNode.removeChild(bubble);
        }
      }, 1100);
    }

    function createImpactEffects(x, y) {
      targetWrapper.classList.remove('shake');
      void targetWrapper.offsetWidth;
      targetWrapper.classList.add('shake');

      shockwaves.push({ x, y, radius: 10, alpha: 1.0 });

      for (let i = 0; i < 28; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 5 + Math.random() * 12;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          decay: 0.03 + Math.random() * 0.04,
          color: Math.random() > 0.4 ? '#ffffff' : '#f59e0b'
        });
      }

      impactMarks.push({ x, y, size: 10 + Math.random() * 10 });
      showFloatingPhrase(x, y);
    }

    function applyBendLimits() {
      if (!whip || whip.length < 3) return;
      for (let i = 1; i < whip.length - 1; i++) {
        const a = whip[i - 1];
        const b = whip[i];
        const c = whip[i + 1];

        const v1x = a.x - b.x, v1y = a.y - b.y;
        const v2x = c.x - b.x, v2y = c.y - b.y;
        const l1 = Math.hypot(v1x, v1y) || 0.0001;
        const l2 = Math.hypot(v2x, v2y) || 0.0001;
        const n1x = v1x / l1, n1y = v1y / l1;
        const n2x = v2x / l2, n2y = v2y / l2;

        const dot = clamp(n1x * n2x + n1y * n2y, -1, 1);
        const angle = Math.acos(dot);
        const t = i / (whip.length - 2);
        const maxBend = lerp(P.handleMaxBendDeg, P.tipMaxBendDeg, t) * Math.PI / 180;
        const bend = Math.PI - angle;

        if (bend <= maxBend) continue;

        const cross = n1x * n2y - n1y * n2x;
        const sign = cross >= 0 ? 1 : -1;
        const targetAngle = Math.PI - maxBend;
        const targetA = Math.atan2(n1y, n1x) + sign * targetAngle;
        const tx = b.x + Math.cos(targetA) * l2;
        const ty = b.y + Math.sin(targetA) * l2;
        const rigidity = lerp(P.bendRigidityStart, P.bendRigidityEnd, t);

        c.x = lerp(c.x, tx, rigidity);
        c.y = lerp(c.y, ty, rigidity);
      }
    }

    function updatePhysics(now) {
      if (!whip.length) return;

      const handleBaseX = width * 0.08;
      const handleBaseY = height * 0.52;

      if (isStriking) {
        const elapsed = now - strikeStartTime;
        const progress = Math.min(1.0, elapsed / strikeDuration);

        if (progress < 0.22) {
          const t = progress / 0.22;
          handlePos.x = handleBaseX - Math.sin(t * Math.PI) * 50;
          handlePos.y = handleBaseY - Math.sin(t * Math.PI) * 20;
        } else if (progress < 0.62) {
          const t = (progress - 0.22) / 0.40;
          handlePos.x = handleBaseX + Math.sin(t * Math.PI) * 45;
          handlePos.y = handleBaseY + (strikeTarget.y - handleBaseY) * 0.3 * Math.sin(t * Math.PI);
        } else {
          handlePos.x = handleBaseX;
          handlePos.y = handleBaseY;
        }

        whip[0].x = handlePos.x + 40;
        whip[0].y = handlePos.y;

        for (let i = 1; i < whip.length; i++) {
          const ratio = i / whip.length;
          const waveCenter = progress * 1.25;
          const distFromWave = Math.abs(ratio - waveCenter);

          if (distFromWave < 0.24) {
            const factor = Math.cos((distFromWave / 0.24) * (Math.PI / 2));
            const loopAmp = (height * 0.32) * factor;

            const destX = handlePos.x + (strikeTarget.x - handlePos.x) * ratio;
            const destY = handlePos.y + (strikeTarget.y - handlePos.y) * Math.pow(ratio, 1.8);

            whip[i].x += (destX - whip[i].x) * 0.48;
            const waveY = destY - Math.sin(progress * Math.PI * 2 + ratio * 4) * loopAmp;
            whip[i].y += (waveY - whip[i].y) * 0.48;
          } else {
            whip[i].y += P.gravity;
          }
        }

        if (progress >= 1.0) {
          isStriking = false;
        }
      } else {
        handlePos.x = handleBaseX;
        handlePos.y = handleBaseY;
        whip[0].x = handlePos.x + 40;
        whip[0].y = handlePos.y;

        const idleTime = now * 0.002;
        for (let i = 1; i < whip.length; i++) {
          const p = whip[i];
          const vx = (p.x - p.px) * P.damping;
          const vy = (p.y - p.py) * P.damping;

          p.px = p.x;
          p.py = p.y;

          p.x += vx;
          p.y += vy + P.gravity;
          p.y += Math.sin(idleTime + i * 0.2) * 0.12;
        }
      }

      for (let iter = 0; iter < P.constraintIters; iter++) {
        for (let i = 0; i < whip.length - 1; i++) {
          const a = whip[i];
          const b = whip[i + 1];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.hypot(dx, dy) || 0.0001;
          const targetLen = segLen(i);
          const diff = (dist - targetLen) / dist * 0.5;
          const ox = dx * diff;
          const oy = dy * diff;

          if (i === 0) {
            b.x -= ox * 2;
            b.y -= oy * 2;
          } else {
            a.x += ox; a.y += oy;
            b.x -= ox; b.y -= oy;
          }
        }
        applyBendLimits();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // 1. Draw Impact Marks
      for (const mark of impactMarks) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(mark.x, mark.y, mark.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(mark.x, mark.y, mark.size * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(239, 68, 68, 0.8)';
        ctx.fill();
        ctx.restore();
      }

      // 2. Draw Whip (Dual-pass spline)
      if (whip.length >= 2) {
        ctx.save();

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#ffffff';

        ctx.beginPath();
        ctx.moveTo(whip[0].x, whip[0].y);
        for (let i = 0; i < whip.length - 1; i++) {
          const { cp1x, cp1y, cp2x, cp2y, x2, y2 } = whipSegmentBezier(whip, i);
          ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
        }
        ctx.lineWidth = P.lineWidthTip + P.outlineWidth * 2;
        ctx.stroke();

        const thickLinks = Math.min(P.handleThickSegments, whip.length - 1);
        if (thickLinks > 0 && P.handleExtraWidth > 0) {
          ctx.beginPath();
          ctx.moveTo(whip[0].x, whip[0].y);
          for (let i = 0; i < thickLinks; i++) {
            const { cp1x, cp1y, cp2x, cp2y, x2, y2 } = whipSegmentBezier(whip, i);
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
          }
          ctx.lineWidth = P.lineWidthHandle + P.handleExtraWidth + P.outlineWidth * 2;
          ctx.stroke();
        }

        ctx.strokeStyle = '#111111';
        for (let i = 0; i < whip.length - 1; i++) {
          const t = i / Math.max(1, whip.length - 2);
          const extra = i < P.handleThickSegments ? P.handleExtraWidth : 0;
          ctx.lineWidth = lerp(P.lineWidthHandle, P.lineWidthTip, t) + extra;

          const { cp1x, cp1y, cp2x, cp2y, x2, y2 } = whipSegmentBezier(whip, i);
          ctx.beginPath();
          ctx.moveTo(whip[i].x, whip[i].y);
          ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
          ctx.stroke();
        }

        ctx.restore();
      }

      // 3. Shockwave Rings
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += 5;
        sw.alpha -= 0.05;

        if (sw.alpha <= 0) {
          shockwaves.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(245, 158, 11, ${sw.alpha})`;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      }

      // 4. Spark Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5 * p.life, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fill();
        ctx.restore();
      }
    }

    function animate(now) {
      updatePhysics(now);
      draw();
      requestAnimationFrame(animate);
    }

    stage.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const rect = stage.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      if (hintOverlay) {
        hintOverlay.style.opacity = '0';
      }

      triggerStrike(clickX, clickY);
    });

    clearMarksBtn.addEventListener('click', () => {
      impactMarks = [];
    });

    window.addEventListener('resize', () => {
      initWhip();
    });

    // تشغيل الاكتشاف التلقائي للصور وبدء المحاكاة
    loadGitHubRepoImages();
    initWhip();
    requestAnimationFrame(animate);
  </script>
</body>
